# Облачный запуск: docker compose up -d
# Перед запуском создай файл .env.cloud (см. .env.cloud.example). Файл в git не попадает.
services:
  studio:
    build: .
    restart: unless-stopped
    env_file: .env.cloud
    volumes:
      - studio-data:/data
    expose:
      - "8000"
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      STUDIO_DOMAIN: ${STUDIO_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on:
      - studio
volumes:
  studio-data:
  caddy-data:
