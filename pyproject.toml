# Конфигурация инструментов разработки и проверок для GremoVOD.
#
# Бизнес-логика и рантайм-зависимости не меняются: они остаются
# в backend/requirements.txt и backend/requirements.lock.txt.
# Этот файл задаёт только линтер (Ruff) и раннер тестов (pytest).

[tool.ruff]
target-version = "py313"
line-length = 120
extend-exclude = [
    "archive",
    "resources",
    "frontend",
    "model-studio",
    "kie-access",
    "node_modules",
]

[tool.ruff.lint]
# F  — pyflakes: неопределённые имена, неиспользуемые импорты и переменные.
# E4 — pycodestyle: ошибки импортов.
# E7 — pycodestyle: ошибки операторов.
# E9 — pycodestyle: синтаксические ошибки.
# B  — flake8-bugbear: типовые дефекты (циклы, except, zip, значение по умолчанию).
select = ["F", "E4", "E7", "E9", "B"]

ignore = [
    # Стиль legacy-кода, дефектом не является.
    "E401",  # несколько импортов в одной строке: import json, os
    "E402",  # импорт не в начале модуля: в backend/main.py регистрация роутеров
              # обязана идти после создания `app`, перенос вверх сломает приложение
    "E501",  # слишком длинная строка: контролируется форматтером, не линтером
    "E701",  # несколько операторов через двоеточие: плотный стиль этого репозитория
    "E702",  # несколько операторов через точку с запятой: плотный стиль этого репозитория
    "E731",  # присваивание лямбды: существующий стиль

    # Ложные срабатывания на используемых в проекте идиомах.
    "B008",  # вызов функции в аргументе по умолчанию: ложно срабатывает на
              # fastapi.File(...) / fastapi.Form(...) в сигнатурах эндпоинтов

    # Технический долг: требует отдельной ревью-правки, а не включения вместе
    # с настройкой линтера. Подробности — в docs/ENVIRONMENT_AUDIT_2026-10-20.md.
    "B007",  # неиспользуемая переменная цикла: 1 место
    "B023",  # замыкание не фиксирует переменную цикла: 15 мест, требует разбора
    "B904",  # raise без from внутри except: 27 мест
    "B905",  # zip без strict=: 4 места
]

[tool.ruff.lint.per-file-ignores]
# Тесты импортируют модули ради доступности и подготовки состояния,
# поэтому неиспользуемый импорт в них — норма, а не дефект.
"backend/test_*.py" = ["F401", "F841"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
# `ruff format` доступен для новых файлов; legacy-код массово не переформатируется.

[tool.pytest.ini_options]
minversion = "7.0"
# Тесты лежат в backend/, модули импортируются как `from backend.xxx import ...`.
# backend — неявный namespace-пакет (без __init__.py), поэтому корень
# репозитория должен быть в sys.path. Без этого `pytest` даёт 36 ошибок
# сбора, а работает только запуск `python -m pytest` из корня.
pythonpath = ["."]
testpaths = ["backend"]
python_files = ["test_*.py"]
addopts = "-ra"
