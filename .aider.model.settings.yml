- name: openai/MiniMax-M3.1-Flash  # Замени на актуальный идентификатор модели в текущей среде, если он отличается
  edit_format: diff
  use_repo_map: true
  send_undo_reply: true
  lazy: true
  examples_as_sys_msg: true     # Фиксирует примеры в системном промпте для удержания кэша
  reminder: none                # Отключает дублирующие напоминания в конце чата для экономии токенов
  extra_params:
    temperature: 0.05
    top_p: 0.95
