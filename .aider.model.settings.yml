# --- МГНОВЕННЫЙ ОТКЛИК И СТРИМИНГ ---
stream: true                  # Выводить текст сразу по мере генерации, не ждать конца ответа
cache-prompts: false          # Отключаем эмуляцию кэша Aider (MiniMax кэширует префикс сам на бэкенде!)
cache-keepalive-pings: 0      # Убираем фоновые пинги, подвешивающие терминал

# --- ОБЛЕГЧЕННАЯ КАРТА ПРОЕКТА ---
map-tokens: 1024              # Снижаем с 2048 до 1024 — парсится и обрабатывается моделью в 2 раза быстрее
map-refresh: manual
subtree-only: true

# --- ОТКЛЮЧЕНИЕ ТОРМОЗЯЩИХ ХУКОВ ---
edit-format: diff
auto-lint: false              # КРИТИЧНО ДЛЯ СКОРОСТИ: запускайте линтер только перед пушем, а не после каждой правки!
auto-commits: false           # Убирает ВТОРОЙ запрос к нейросети для генерации commit message (экономит 5-10 сек на каждом шаге)
dirty-commits: false

# --- ПРОПУСК ПРОВЕРКИ МЕТАДАННЫХ МОДЕЛИ ПРИ СТАРТЕ ---
show-model-warnings: false
check-update: false

read:
  - MINIMAX_SKILLS.md
