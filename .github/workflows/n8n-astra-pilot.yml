name: n8n Astra pilot offline checks

on:
  push:
    branches:
      - feature/n8n-astra-contract-hardening-20261019
  pull_request:
    paths:
      - 'integrations/n8n/pilot_state_sqlite.py'
      - 'backend/test_n8n_astra_pilot.py'
      - 'backend/test_n8n_final_routing_spec.py'
      - 'docs/specs/n8n-production-2026-10-19/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-control-plane:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Offline SQLite pilot regression tests
        run: python -m unittest -v backend.test_n8n_astra_pilot backend.test_n8n_final_routing_spec
      - name: Verify Astra machine-readable 52-node contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          base = Path("docs/specs/n8n-production-2026-10-19")
          j = json.loads((base / "nodes.json").read_text(encoding="utf-8"))
          ids = [x["id"] for x in j["nodes"]]
          assert len(ids) == len(set(ids)) == 52
          assert len([x for x in ids if x.startswith("N")]) == 43
          assert len([x for x in ids if x.startswith("S")]) == 9
          assert j["status"] == "SPECIFIED_NOT_EXECUTED"
          assert j["runtime_status"]["p0_media_capability"] == "BLOCKED_NO_REAL_MP4"
          assert all(x["condition"] != "any_FAIl" for x in j["conditional_routes"])
          assert len([x for x in j["nodes"] if "astra_v1_1" in x]) >= 30
          print("52 logical stages + fail-closed Astra contract: OK")
          PY
