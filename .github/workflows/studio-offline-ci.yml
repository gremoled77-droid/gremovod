name: GremoVOD Studio offline CI

# GA-04: offline verification of a candidate commit.
#
# Rules this workflow follows:
#  * no repository secrets, no paid provider, no running Studio, no n8n cloud call;
#  * every backend run works on a temporary SQLite database;
#  * the path filter lives on the trigger, not on the jobs: `paths` is not a valid
#    job keyword, and a workflow that uses it fails to start at all;
#  * the contract checks live in studio-ci-contract.yml, which has no path filter and
#    therefore always produces a check for every pull request;
#  * "this workflow exists" is not "branch protection requires it" — the required
#    check list is a separate owner decision (D7) and is not touched here.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'backend/**'
      - 'db/**'
      - 'scripts/**'
      - 'tests/**'
      - 'frontend/**'
      - '.github/workflows/studio-offline-ci.yml'
  push:
    branches:
      - 'mavis/work'
    paths:
      - 'backend/**'
      - 'db/**'
      - 'scripts/**'
      - 'tests/**'
      - 'frontend/**'
      - '.github/workflows/studio-offline-ci.yml'

permissions:
  contents: read

concurrency:
  group: studio-offline-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend-unit:
    name: Backend unit tests (offline, temporary SQLite)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: backend/requirements.lock.txt
      - name: Install the pinned backend dependencies
        run: python -m pip install --quiet -r backend/requirements.lock.txt
      - name: Point the Studio database at a temporary directory
        run: echo "STUDIO_DATA_DIR=$RUNNER_TEMP/gremovod-ci-db" >> "$GITHUB_ENV"
      - name: Backend unit tests
        run: |
          MODULES=$(python - <<'PY'
          import pathlib
          # Media/FFmpeg assertions run in the separate backend-media job.
          skip = {"test_media_qc.py", "test_n35_freeze.py"}
          modules = sorted(
              "backend." + p.stem
              for p in pathlib.Path("backend").glob("test_*.py")
              if p.name not in skip
          )
          print(" ".join(modules))
          PY
          )
          echo "Running: $MODULES"
          python -X utf8 -m unittest $MODULES

  backend-media:
    name: Backend media and QC tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: backend/requirements.lock.txt
      - name: Install the pinned backend dependencies
        run: python -m pip install --quiet -r backend/requirements.lock.txt
      - name: Install FFmpeg for the disposable media tests
        # Worst case 3 x (60 + 120) s + 2 x 10 s pause = 560 s, inside the 10 min limit,
        # so every promised attempt really runs. tools/test_ci_contracts.py checks it.
        timeout-minutes: 10
        env:
          APT_ATTEMPTS: 3
          APT_UPDATE_TIMEOUT: 60
          APT_INSTALL_TIMEOUT: 120
          APT_PAUSE: 10
        run: |
          apt="apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30"
          for attempt in $(seq 1 "$APT_ATTEMPTS"); do
            if timeout "$APT_UPDATE_TIMEOUT" sudo $apt update -qq \
              && timeout "$APT_INSTALL_TIMEOUT" sudo $apt install -y -qq ffmpeg; then
              exit 0
            fi
            echo "::warning::apt attempt $attempt of $APT_ATTEMPTS failed or timed out"
            if [ "$attempt" -lt "$APT_ATTEMPTS" ]; then sleep "$APT_PAUSE"; fi
          done
          echo "::error::FFmpeg could not be installed after $APT_ATTEMPTS attempts; the media tests need it"
          exit 1
      - name: Show the FFmpeg the media tests use
        run: |
          command -v ffmpeg ffprobe
          ffmpeg -hide_banner -version
          ffprobe -hide_banner -version
      - name: Point the Studio database at a temporary directory
        run: echo "STUDIO_DATA_DIR=$RUNNER_TEMP/gremovod-ci-db" >> "$GITHUB_ENV"
      - name: Media and QC tests
        run: python -X utf8 -m unittest backend.test_media_qc backend.test_n35_freeze

  frontend-unit:
    name: Frontend unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      # Two frontend tests compare the browser prompt against the server prompt and
      # call the backend Python modules directly, so they need a Python with the
      # backend dependencies. The test suite reads STUDIO_PYTHON for exactly this.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: backend/requirements.lock.txt
      - name: Install the backend dependencies for the server-side comparison
        run: python -m pip install --quiet -r backend/requirements.lock.txt
      - name: Install the frontend dependencies
        run: npm ci --no-audit --no-fund
        working-directory: frontend
      - name: Frontend unit tests
        env:
          STUDIO_PYTHON: python
        run: npm test
        working-directory: frontend

  frontend-typecheck-build:
    name: Frontend TypeScript and production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install the frontend dependencies
        run: npm ci --no-audit --no-fund
        working-directory: frontend
      - name: TypeScript type check
        run: npx tsc --noEmit
        working-directory: frontend
      - name: Production build (Vite)
        run: npx vite build
        working-directory: frontend
