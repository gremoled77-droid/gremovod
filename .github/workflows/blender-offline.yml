name: Blender offline contracts
on:
  pull_request:
    paths:
      - 'scripts/blender/**'
      - 'schemas/blender/**'
      - 'tests/test_blender_*.py'
      - 'requirements-blender*.txt'
      - '.github/workflows/blender-offline.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-blender-test.txt
      - run: >-
          python -m pytest -q --basetemp .pytest-blender-ci
          tests/test_blender_manifests.py tests/test_blender_preflight.py
          tests/test_blender_runner_security.py tests/test_blender_reference_binding.py
          tests/test_blender_qc.py tests/test_blender_skill_install.py
