<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ГремоВОД v2 — макет</title>
<style>
:root{--bg:#0e0f12;--surface:#16181d;--surface-2:#1e2128;--border:#2a2e37;--border-strong:#3a3f4a;--text:#ece8df;--muted:#8b8f99;--accent:#f2b134;--accent-ink:#17130a;--ok:#5ec27a;--bad:#e27b7b;--info:#7ea8e8;--r:12px}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:13px/1.45 'Onest',system-ui,-apple-system,'Segoe UI',sans-serif}
button,select,input,textarea{font:inherit;color:inherit}
button{background:var(--surface-2);border:1px solid var(--border);border-radius:999px;padding:6px 12px;cursor:pointer}
button:hover{border-color:var(--border-strong)}
button.main{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
button.ghost{background:transparent}
button.on{border-color:var(--accent);color:var(--accent)}
input,select,textarea{background:var(--surface-2);border:1px solid var(--border);border-radius:8px;padding:6px 8px}
textarea{width:100%;min-height:54px;resize:vertical}
.app{display:grid;grid-template-columns:232px 1fr;grid-template-rows:52px 1fr;height:100vh}
header{grid-column:1/3;display:flex;align-items:center;gap:14px;padding:0 16px;border-bottom:1px solid var(--border);background:var(--surface)}
.logo{font-weight:700;cursor:pointer}.logo i{color:var(--accent);font-style:normal}
.crumbs{display:flex;gap:6px;color:var(--muted);flex:1;flex-wrap:wrap}
.crumbs a{color:var(--text);cursor:pointer;text-decoration:none}.crumbs a:hover{color:var(--accent)}
.chip{border:1px solid var(--border);border-radius:999px;padding:4px 10px;cursor:pointer;white-space:nowrap}
nav{border-right:1px solid var(--border);padding:12px 8px;overflow:auto;background:var(--surface)}
nav h4{margin:14px 8px 4px;font-size:11px;letter-spacing:.06em;color:var(--muted);text-transform:uppercase}
nav a{display:block;padding:6px 10px;border-radius:8px;cursor:pointer;color:var(--text)}
nav a:hover{background:var(--surface-2)}nav a.act{background:var(--surface-2);color:var(--accent)}
nav a.sub{padding-left:24px;color:var(--muted)}nav a.sub.act{color:var(--accent)}
.badge{float:right;color:var(--muted);font-size:11px}
main{overflow:auto;padding:18px 22px 120px;position:relative}
h1{font-size:20px;margin:0 0 4px}h2{font-size:15px;margin:18px 0 8px}
.muted{color:var(--muted)}.ok{color:var(--ok)}.warn{color:var(--accent)}.bad{color:var(--bad)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:12px}
.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}
.thumb{aspect-ratio:16/9;border-radius:8px;background:linear-gradient(135deg,#2c3140,#1b1d24);position:relative;display:flex;align-items:flex-end;padding:6px;font-size:11px;color:var(--muted);cursor:pointer;border:1px solid var(--border)}
.thumb.sel{outline:2px solid var(--accent)}
.thumb .tick{position:absolute;top:6px;left:6px;color:var(--ok);font-weight:700}
.big{height:44vh;max-width:100%;aspect-ratio:16/9;border-radius:var(--r);background:linear-gradient(135deg,#3a3326,#1d2230 60%,#141820);position:relative;display:flex;align-items:center;justify-content:center;color:var(--muted);border:1px solid var(--border)}
.big .refine{position:absolute;right:10px;bottom:10px;opacity:0;transition:.15s}
.big:hover .refine{opacity:1}
.continue{background:linear-gradient(90deg,#2a2416,var(--surface));border:1px solid #4a3c1c;border-radius:var(--r);padding:16px;display:flex;align-items:center;gap:16px}
.tabs{display:flex;gap:6px;margin:10px 0}
.tabs button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
table{border-collapse:collapse;width:100%}td,th{border-bottom:1px solid var(--border);padding:6px;text-align:left;vertical-align:top}
.track{position:fixed;left:232px;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--border);padding:8px 16px;display:flex;gap:6px;align-items:center;overflow:auto;z-index:2}
.track .seg{min-width:70px;padding:6px 8px;border:1px solid var(--border);border-radius:8px;background:var(--surface-2);cursor:pointer;font-size:11px}
.track .seg.cur{border-color:var(--accent)}
.track .joint{color:var(--muted);font-size:10px;cursor:pointer}
.drawer{position:fixed;top:52px;right:0;bottom:0;width:340px;background:var(--surface);border-left:1px solid var(--border);padding:14px;overflow:auto;transform:translateX(100%);transition:.2s;z-index:5}
.drawer.open{transform:none}
.drawer details{border-bottom:1px solid var(--border);padding:6px 0}.drawer summary{cursor:pointer}
.pe{display:grid;grid-template-columns:170px 1fr;gap:14px;align-items:start}
.pe .side{display:flex;flex-direction:column;gap:6px}.pe .side h4{margin:8px 0 2px}
.pe .pick{display:flex;align-items:center;gap:8px;padding:5px;border:1px solid var(--border);border-radius:8px;cursor:pointer;background:var(--surface)}
.pe .pick.on{border-color:var(--accent)}.pe .pick i{width:34px;aspect-ratio:1;border-radius:6px;background:linear-gradient(135deg,#4a4130,#222633);flex:none}
.pe .pick.plus{justify-content:center;color:var(--muted);border-style:dashed}
.stage{height:42vh;aspect-ratio:16/9;max-width:100%;border-radius:var(--r);position:relative;overflow:hidden;background:linear-gradient(135deg,#3a3326,#1d2230 60%,#141820);user-select:none;touch-action:none}
.stage .col{position:absolute;top:0;bottom:0;width:33.333%;border-right:1px dashed rgba(255,255,255,.12)}
.stage .col span{position:absolute;top:6px;left:8px;font-size:11px;color:var(--muted)}
.stage .loc{position:absolute;left:10px;bottom:8px;font-size:12px;color:var(--muted)}
.mk{position:absolute;display:flex;flex-direction:column;align-items:center;cursor:grab;font-size:11px}
.mk i{display:block;border-radius:50% 50% 8px 8px;background:linear-gradient(160deg,#f2b134,#7a5a1c);border:2px solid #fff3}
.stage .photo{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#6b5a3a,#2a3550 60%,#1a2030);color:#fff8;font-size:13px}
.pop{position:absolute;z-index:3;background:var(--surface-2);border:1px solid var(--border);border-radius:8px;padding:8px;display:flex;flex-direction:column;gap:6px;font-size:12px}
.tb{display:inline-flex;align-items:center;gap:6px}.tb.on{border-color:var(--accent);color:var(--accent)}
.tpanel{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:12px;margin:6px 0;display:flex;gap:18px;flex-wrap:wrap;align-items:flex-start;max-width:calc(42vh*16/9)}
.tpanel h5{margin:0 0 6px;font-size:12px;color:var(--muted);font-weight:600}
.ib{display:inline-flex;flex-direction:column;align-items:center;gap:2px;padding:4px 6px;font-size:11px;min-width:58px}.ib.on{border-color:var(--accent);color:var(--accent)}
.ib:disabled{opacity:.35;cursor:not-allowed}.lock{color:var(--warn,#e0a040);font-size:12px;margin:4px 0}
.hud{position:absolute;left:50%;top:calc(50% - 62px);transform:translateX(-50%);pointer-events:none;opacity:.5;color:#fff;font:11px/1.35 ui-monospace,Consolas,monospace;text-align:center;text-shadow:0 0 4px #000}
.hud .dg{border:1px solid #fff8;border-radius:4px;padding:1px 6px;display:inline-block;letter-spacing:.04em}
.lt{position:absolute;transform:translate(-50%,-50%);pointer-events:none;color:#ffd36b;opacity:.8;filter:drop-shadow(0 0 8px #f2b134)}
.lt::before{content:"";position:absolute;inset:-26px;border-radius:50%;background:radial-gradient(circle,#f2b13455,transparent 70%);z-index:-1}
.lt small{display:block;text-align:center;font-size:10px;color:#fff9;text-shadow:0 0 3px #000;margin-top:-2px}
.dd{position:relative;display:inline-block}
.menu{position:absolute;top:calc(100% + 4px);left:0;z-index:20;background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:10px;box-shadow:0 8px 24px #000a;display:flex;gap:14px;flex-wrap:wrap;width:max-content;max-width:440px}
.menu h5{margin:0 0 4px;font-size:11px;color:var(--muted);font-weight:600}
.tb small{color:var(--muted);font-size:11px}.hud,.lt{pointer-events:auto!important;cursor:pointer}
.warnb{border-color:#e0a040;color:#e0a040;font-size:12px}
.trash{position:absolute;right:10px;top:8px;z-index:4;opacity:.4;background:#0006;border:0;border-radius:8px;padding:5px 6px;color:#fff;cursor:pointer}.trash:hover{opacity:1;background:#000a}
.play{display:inline-flex;flex-direction:column;align-items:center;gap:2px;background:none;border:0;cursor:pointer;padding:0}
.play .yt{width:48px;height:34px;border-radius:10px;background:#f2b134;display:flex;align-items:center;justify-content:center}
.play small{font-size:10px;color:var(--muted);letter-spacing:.08em;font-weight:700}
.mchips button.on{border-color:var(--accent);color:var(--accent)}
.llmbox{cursor:pointer;max-width:calc(42vh*16/9);margin:8px 0}.llmbox pre{white-space:pre-wrap;margin:6px 0;font:12px/1.5 ui-monospace,Consolas,monospace;overflow:hidden}
.side .dd{display:block}.mk b{color:#ffd36b}
.plusbar{display:flex;justify-content:flex-end;margin-top:6px}
.bar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:8px 0}
.opts{display:flex;flex-wrap:wrap;gap:4px;margin:6px 0}
.opts button{padding:3px 9px;font-size:12px}
.toast{position:fixed;left:50%;bottom:70px;transform:translateX(-50%);background:var(--surface-2);border:1px solid var(--accent);padding:8px 14px;border-radius:999px;opacity:0;transition:.2s;z-index:9;pointer-events:none}
.toast.show{opacity:1}
.tree a{display:block;padding:3px 6px;border-radius:6px;cursor:pointer}.tree a:hover{background:var(--surface-2)}.tree a.act{color:var(--accent)}
.split{display:grid;grid-template-columns:240px 1fr;gap:16px}
.info{display:inline-block;width:16px;height:16px;border-radius:50%;border:1px solid var(--border-strong);text-align:center;font-size:10px;line-height:14px;color:var(--muted);cursor:help}
.note{font-size:11px;color:var(--muted);border:1px dashed var(--border);border-radius:8px;padding:6px 8px;margin-top:10px}
</style>
</head>
<body>
<div class="app">
  <header>
    <span class="logo" onclick="go('home')"><i>◆</i> ГремоВОД</span>
    <div class="crumbs" id="crumbs"></div>
    <span class="chip" id="cost" onclick="drawer('costs')"></span>
    <span class="chip" onclick="drawer('queue')">очередь 2</span>
  </header>
  <nav id="nav"></nav>
  <main id="main"></main>
</div>
<div class="track" id="track" hidden></div>
<div class="drawer" id="drawer"></div>
<div class="toast" id="toast"></div>
<script>
// Макет ГремоВОД v2: данные выдуманы, сервер не вызывается, генерации не настоящие.
const S={
 heroes:[{id:'grem',name:'Грэм',pack:6,voice:'',looks:['Основной','Зима','Карнавал']},{id:'prokhor',name:'Прохор',pack:8,voice:'ElevenLabs · «Прохор»',looks:['Основной']},{id:'car',name:'Шестёрка',pack:4,voice:'—',looks:['Основной'],group:'Транспорт'}],
 places:[{id:'minsk',name:'Минск',d:0},{id:'nemiga',name:'Немига',d:1},{id:'yard',name:'Двор на Немиге',d:2,ok:true},{id:'night',name:'Ночь',d:3,variant:true},{id:'winter',name:'Зима',d:3,variant:true,ok:true},{id:'komar',name:'Комаровка',d:1,ok:true},{id:'airport',name:'Аэропорт',d:1}],
 scenes:[{n:1,t:'Встреча в аэропорту',place:'Аэропорт',heroes:'Грэм, Прохор',want:'Прохор хочет уехать незаметно — фанаты у выхода',change:'чужак → пассажир',kadry:4,done:3},
  {n:2,t:'За салом на Комаровку',place:'Комаровка',heroes:'Грэм, Прохор',want:'Прохор хочет сала, рынок закрывается',change:'скепсис → азарт',kadry:5,done:1},
  {n:3,t:'Фантазия: карнавал',place:'Двор на Немиге › Ночь',heroes:'Грэм (Карнавал)',want:'Грэм хочет произвести впечатление',change:'мечта → реальность',kadry:3,done:0,layer:'фантазия'}],
 kadr:{n:3,sense:'Грэм решает подвезти звезду',shots:[{n:1,t:'Грэм подходит к машине слева',photo:true,take:'принят'},{n:2,t:'Общий план: город',photo:true,take:'выбран'},{n:3,t:'Крупно лицо — хитрый прищур',photo:true,take:''},{n:4,t:'Машина сзади, дым из трубы',photo:false,take:''}]},
 variants:4,sel:3,approved:2,trys:0,mode:'shot',shotTab:'photo',seriesTab:'scenes',worldTab:'heroes',hero:'grem',place:'yard',cur:{scene:2,kadr:3,shot:3}
};
const $=id=>document.getElementById(id);
function toast(t){const e=$('toast');e.textContent=t;e.classList.add('show');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('show'),1800)}
function go(r){location.hash='#/'+r}
function route(){return (location.hash.replace(/^#\//,'')||'home').split('/')}
function crumbs(parts){$('crumbs').innerHTML=parts.map(([t,r])=>r?`<a onclick="go('${r}')">${t}</a>`:`<span>${t}</span>`).join(' › ')}
function nav(r){
 const a=(k,t,cls='',b='')=>`<a class="${cls}${r.join('/').startsWith(k)?' act':''}" onclick="go('${k}')">${t}${b?`<span class="badge">${b}</span>`:''}</a>`;
 $('nav').innerHTML=`<h4>Мир</h4>${a('world/heroes','Герои')}${a('world/places','Места')}${a('world/props','Реквизит')}${a('world/passport','Паспорт','', 'стиль не утв.')}
 <h4>Серии</h4>${a('series','01 · Пилот')}${S.scenes.map(s=>a('scene/'+s.n,`Сцена ${String(s.n).padStart(2,'0')}`,'sub')).join('')}<a class="sub" onclick="toast('Новая серия — в макете не создаётся')">+ серия</a>
 <h4>Фото</h4>${a('photo','Пробы','', '7')}
 <h4>Библиотека</h4>${a('world/unassigned','Без привязки','', '26')}
 <h4>Ещё</h4><a onclick="toast('Инструменты: узлы, рилсы, агенты — свёрнуты')">Инструменты</a><a onclick="toast('Настройки')">Настройки</a>`}
function cost(scope,sum){$('cost').textContent=`${scope} · $${sum}`}
function track(items,cur,joints){const t=$('track');if(!items){t.hidden=true;return}t.hidden=false;
 t.innerHTML=items.map((it,i)=>(i&&joints?`<span class="joint" title="Тип стыка" onclick="toast('Тип стыка: обычный / по движению / по форме / по звуку / трансформация')">⟷</span>`:'')+`<div class="seg${i===cur?' cur':''}" onclick="${it.go}">${it.t}<br><span class="muted">${it.d}</span></div>`).join('')+`<span class="muted" style="margin-left:auto">⚠ <span title="Сверка соседних">Грэм уходит вправо, в шоте 3 входит справа — так задумано?</span></span>`}
function drawer(kind){const d=$('drawer');if(d.dataset.k===kind&&d.classList.contains('open')){d.classList.remove('open');return}d.dataset.k=kind;d.classList.add('open');d.innerHTML=`<div class="row" style="justify-content:space-between"><b>${{refs:'Что уйдёт в запрос',refine:'Допилить вариант '+S.sel,queue:'Очередь',costs:'Расходы'}[kind]}</b><button class="ghost" onclick="$('drawer').classList.remove('open')">✕</button></div>`+DR[kind]()}
const opts=(list)=>`<div class="opts">${list.map(o=>`<button onclick="this.classList.toggle('on');sum()">${o}</button>`).join('')}</div>`;
function sum(){const on=[...document.querySelectorAll('#drawer .opts .on')].map(b=>b.textContent);const e=$('rsum');if(e)e.textContent=on.length?'Изменится: '+on.join(', '):'Ничего не выбрано'}
const DR={
 refs:()=>`<p class="muted">Студия выбрала 2–4 вида под план. Можно поменять.</p>
  <div class="grid" style="grid-template-columns:1fr 1fr">
  <div class="thumb"><span class="tick">✓</span>Image 1 · лицо Грэма 3/4</div><div class="thumb"><span class="tick">✓</span>Image 2 · Грэм, полный рост</div>
  <div class="thumb"><span class="tick">✓</span>Image 3 · Комаровка · день</div><div class="thumb"><span class="tick">✓</span>Image 4 · эталон стиля</div></div>
  <p class="bad">Не хватает: голос Грэма; эталон стиля не утверждён</p>
  <p class="muted">Реальные фото места в запрос не уходят (скрыты).</p>`,
 refine:()=>`<div class="opts"><button class="on" onclick="toast('Правка этого варианта')">Исправить этот</button><button onclick="toast('Результат станет фото нового шота сразу после текущего')">Новый шот из этого</button></div>
  <b>Что не так?</b>
  <details open><summary>Источник света</summary>${opts(['окно','фонарь','солнце','лампа салона','фары','слева','справа','сверху','контровой','мягче','жёстче'])}</details>
  <details><summary>3 плана</summary>${opts(['чётче передний','чётче средний','чётче задний','размытый задний (боке)','размытый передний (капли, стекло)','+ предмет на переднем'])}</details>
  <details><summary>Воздух: пространство и туман</summary>${opts(['больше воздуха','дымка','туман','пар','пыль','снежинки','проще и чище'])}</details>
  <details><summary>Фактура кожи</summary>${opts(['живая кожа','мягче','больше деталей','меньше пластика','вернуть лицо героя'])}</details>
  <p><input placeholder="Хочу увидеть: щурится" style="width:100%"></p>
  <p class="muted" id="rsum">Ничего не выбрано</p>
  <button class="main" onclick="addVar();render();toast('Готово: новый вариант — доработка (макет)')">Допилить · $0.04</button>
  <p class="note">После 2–3 доработок подряд: «качество может поплыть — вернитесь к исходнику».</p>`,
 queue:()=>`<table><tr><td>GPT Image · «Грэм у машины»</td><td class="warn">ждёт ответа 6 мин</td><td><button onclick="toast('Отмечено неудачным после проверки в PiAPI — блок снят')">Снять ожидание</button></td></tr>
  <tr><td>Nano Banana · то же</td><td class="ok">готово</td><td></td></tr></table>
  <p class="note">Такой же запрос той же модели не уйдёт, пока первый не ответит. Другую модель — можно сразу.</p>`,
 costs:()=>`<table><tr><th>Масштаб</th><th>Факт</th><th>Резерв</th></tr><tr><td>Шот 3</td><td>$0.12</td><td>$0.04</td></tr><tr><td>Кадр 03</td><td>$0.86</td><td>$0.04</td></tr><tr><td>Сцена 02</td><td>$3.10</td><td>$0.19</td></tr><tr><td>Пилот</td><td>$40.80</td><td>$1.20</td></tr><tr><td>ГремоВОД</td><td>$58.80</td><td>$1.20</td></tr></table>
  <p class="muted">День: $4.20 из $10. Одно задание считается один раз на любом уровне. Суммы выдуманы.</p>`
};
const V={
 home:()=>{crumbs([['ГремоВОД']]);cost('ГремоВОД','58.80');track();return `
  <div class="continue"><div style="flex:1"><div class="muted">Продолжить работу</div><h1>Пилот › Сцена 02 › Кадр 03 › Шот 3 · Фото</h1><span class="muted">вчера, 23:10 · есть несохранённый черновик</span></div><button class="main" onclick="go('shot')">▶ Продолжить</button></div>
  <h2>Серии <button class="ghost" onclick="toast('+ серия')">+ серия</button></h2>
  <div class="card row" style="justify-content:space-between;cursor:pointer" onclick="go('series')"><b>01 · Пилот</b><span class="muted">3 сцены · план 4:00 · факт 0:46 · кадров готово 4 из 12 · $40.80</span></div>
  <h2>Фото</h2><div class="card row" style="justify-content:space-between;cursor:pointer" onclick="go('photo')"><span>Пробы — 7 фото без привязки</span><span class="muted">открыть</span></div>
  <p class="warn" style="margin-top:16px">Не хватает: у Грэма нет голоса · пакет Грэма 6/8 · эталон стиля не выбран</p>`},
 'world/heroes':()=>{const h=S.heroes.find(x=>x.id===S.hero);crumbs([['ГремоВОД','home'],['Мир'],['Герои']]);cost('ГремоВОД','58.80');track();return `
