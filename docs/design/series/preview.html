<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>Грэм — дизайн-система сериала</title>
<link rel="stylesheet" href="tokens.css">
<style>
body{margin:0;background:var(--s-night);color:var(--s-paper);font:var(--s-caption);padding:5vmin;display:grid;gap:4vmin}
.sw{display:flex;flex-wrap:wrap;gap:1.5vmin}
.sw div{width:16vmin;height:11vmin;padding:1vmin;box-sizing:border-box;border:1px solid #0006;font-size:1.8vmin;display:flex;align-items:flex-end}
.title{font:var(--s-title);text-transform:uppercase;letter-spacing:.02em}
.plate{display:inline-flex;gap:1.6vmin;font:var(--s-plate)}
.plate i{width:3.6vmin;background:repeating-conic-gradient(var(--s-taxi) 0 25%,var(--s-night) 0 50%) 0 0/1.8vmin 1.8vmin}
.plate span{border-left:.5vmin solid var(--s-sodium);padding-left:1.6vmin}
.plate small{display:block;font:var(--s-caption);color:var(--s-paper-dim)}
</style></head><body>
<div class="title">Грэм <span style="color:var(--s-sodium)">· 2106</span></div>
<div class="plate"><i></i><span>Грэм<small>таксист, ВАЗ-2106</small></span></div>
<div class="sw">
<div style="background:var(--s-night)">night</div><div style="background:var(--s-asphalt)">asphalt</div>
<div style="background:var(--s-soot)">soot</div><div style="background:var(--s-paper);color:#15110d">paper</div>
<div style="background:var(--s-sodium);color:#15110d">sodium</div><div style="background:var(--s-taxi);color:#15110d">taxi</div>
<div style="background:var(--s-brick)">brick</div><div style="background:var(--s-panel)">panel</div>
<div style="background:var(--s-lada);color:#15110d">lada</div></div>
</body></html>
